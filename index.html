<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Coach Muscu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56;
  --amber: #EF9F27; --amber-light: #FAEEDA; --amber-dark: #854F0B;
  --bg: #f4f6f5; --surface: #ffffff; --text: #1a1f1d; --text-muted: #6b7873;
  --border: rgba(0,0,0,0.08); --radius: 14px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 430px; margin: 0 auto; }
.header { background: var(--surface); padding: 16px 20px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.header-row { display: flex; align-items: center; gap: 10px; }
.back-btn { display: none; background: none; border: none; cursor: pointer; color: var(--green); padding: 2px; flex-shrink: 0; }
.back-btn svg { width: 24px; height: 24px; display: block; }
.header h1 { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header h1 span { color: var(--green); }
.header-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.screen { display: none; padding: 16px; padding-bottom: 90px; }
.screen.active { display: block; }
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding: 10px 0 18px; z-index: 200; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: none; cursor: pointer; font-size: 11px; font-family: 'DM Sans', sans-serif; color: var(--text-muted); }
.nav-btn.active { color: var(--green); }
.nav-btn svg { width: 22px; height: 22px; }
.level-filter { display: flex; gap: 8px; margin-bottom: 16px; }
.level-chip { flex: 1; padding: 9px 8px; border-radius: 24px; border: 1px solid var(--border); font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; background: var(--surface); color: var(--text-muted); text-align: center; font-weight: 500; }
.level-chip.active { background: var(--green); color: white; border-color: var(--green); }
.body-map-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.body-map-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 14px; }
.body-map-views { display: flex; justify-content: center; gap: 20px; }
.body-view-wrap { text-align: center; }
.body-view-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.body-view-wrap svg { width: 115px; height: auto; }
.mz { cursor: pointer; transition: opacity 0.15s; }
.mz:hover { opacity: 0.7; }
.mz.selected { filter: drop-shadow(0 0 4px rgba(29,158,117,0.8)); }
.section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.muscle-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.muscle-chip { padding: 8px 14px; border-radius: 24px; border: 1px solid var(--border); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; background: var(--surface); color: var(--text); font-weight: 500; }
.muscle-chip.active { background: var(--green); color: white; border-color: var(--green); }
.exo-list { display: flex; flex-direction: column; gap: 10px; }
.exo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; }
.exo-card:active { transform: scale(0.98); }
.exo-img-wrap { width: 100%; height: 150px; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.exo-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
.exo-img-ph { font-size: 48px; }
.exo-body { padding: 13px 15px; }
.exo-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.exo-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
.exo-level { flex-shrink: 0; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; margin-top: 2px; }
.lv-debutant { background: var(--green-light); color: var(--green-dark); }
.lv-confirme { background: var(--amber-light); color: var(--amber-dark); }
.exo-cat { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
.loading { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 14px; }
.detail-img-wrap { width: 100%; height: 200px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; }
.detail-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
.thumb-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; scrollbar-width: none; }
.thumb-row::-webkit-scrollbar { display: none; }
.thumb-row img { height: 72px; width: 72px; object-fit: contain; border-radius: 8px; background: var(--bg); flex-shrink: 0; border: 1px solid var(--border); }
.detail-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 10px; }
.detail-name { font-size: 20px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
.badges { display: flex; gap: 7px; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 4px 12px; border-radius: 12px; font-weight: 600; }
.badge-green { background: var(--green-light); color: var(--green-dark); }
.badge-amber { background: var(--amber-light); color: var(--amber-dark); }
.badge-gray { background: #f0f2f1; color: var(--text-muted); }
.detail-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; }
.detail-section h3 { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.detail-section p { font-size: 14px; line-height: 1.75; }
.muscles-row { display: flex; flex-wrap: wrap; gap: 6px; }
.add-btn { width: 100%; padding: 16px; background: var(--green); color: white; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 4px; }
.add-btn:active { background: var(--green-dark); }
.add-btn.added { background: #9ab; }
.seance-empty { text-align: center; padding: 48px 20px; }
.seance-empty .icon { font-size: 44px; margin-bottom: 12px; }
.seance-empty p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
.seance-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.seance-top-title { font-size: 15px; font-weight: 600; }
.clear-btn { font-size: 13px; color: #E24B4A; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }
.seance-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.seance-item-name { font-size: 14px; font-weight: 600; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.check.on { background: var(--green); border-color: var(--green); }
.seance-footer { background: var(--green-light); border-radius: var(--radius-sm); padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.seance-footer span { font-size: 14px; color: var(--green-dark); font-weight: 600; }
.finish-btn { padding: 9px 20px; background: var(--green); color: white; border: none; border-radius: 20px; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; font-weight: 600; }
.warning { background: var(--amber-light); border-radius: var(--radius-sm); padding: 11px 14px; margin-bottom: 16px; font-size: 12px; color: var(--amber-dark); line-height: 1.5; }
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1f1d; color: white; font-size: 14px; padding: 12px 24px; border-radius: 24px; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.badge-count { display: none; background: var(--green); color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 3px; }
</style>
</head>
<body>

<!-- ÉCRAN EXERCICES -->
<div class="screen" id="screenExos">
  <div class="level-filter">
    <button class="level-chip active" onclick="setLevel('all',this)">Tous</button>
    <button class="level-chip" onclick="setLevel('debutant',this)">Débutant</button>
    <button class="level-chip" onclick="setLevel('confirme',this)">Confirmé</button>

<!-- ÉCRAN SÉANCE -->
<div class="screen" id="screenSeance">

  <button class="nav-btn active" id="nav-home" onclick="showNav('home')">

      <circle cx="12" cy="8" r="5"/><path d="M3 21c0-4.418 4.03-8 9-8s9 3.582 9 8"/>

<div class="toast" id="toast"></div>

<script>
const WGER = 'https://wger.de/api/v2';
const MUSCLES = [
  { key:'chest',     label:'Pectoraux',  cat:11, emoji:'💪' },
  { key:'back',      label:'Dos',        cat:12, emoji:'🏋️' },
  { key:'shoulders', label:'Épaules',    cat:13, emoji:'🏋️' },
  { key:'arms',      label:'Bras',       cat:8,  emoji:'💪' },
  { key:'abs',       label:'Abdominaux', cat:10, emoji:'🎯' },
  { key:'legs',      label:'Jambes',     cat:9,  emoji:'🦵' },
  { key:'calves',    label:'Mollets',    cat:14, emoji:'🦶' },
  { key:'glutes',    label:'Fessiers',   cat:9,  emoji:'🍑' },
];

let currentMuscleKey=null, currentExo=null, currentLevel='all';
let allExos=[], navStack=[], seance=[];

function getLevel(id){ return (id%2===0)?'debutant':'confirme'; }

function getName(e){
  if(e.translations){
    const fr=e.translations.find(t=>t.language===12); if(fr&&fr.name) return fr.name;
    const en=e.translations.find(t=>t.language===2); if(en&&en.name) return en.name;
    const any=e.translations.find(t=>t.name); if(any) return any.name;
  }
  return e.name||`Exercice #${e.id}`;
}
function getDesc(e){
  if(e.translations){
    const fr=e.translations.find(t=>t.language===12); if(fr&&fr.description) return strip(fr.description);
    const en=e.translations.find(t=>t.language===2); if(en&&en.description) return strip(en.description);
  }
  return e.description?strip(e.description):'';
}
function getImg(e){ if(e.images&&e.images.length>0){const m=e.images.find(i=>i.is_main)||e.images[0];return m.image;} return null; }
function strip(h){ return h.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }

function init(){
  document.getElementById('muscleChips').innerHTML = MUSCLES.map(m=>
    `<button class="muscle-chip" onclick="selectMuscle('${m.key}')">${m.emoji} ${m.label}</button>`
  ).join('');
}

function selectMuscle(key){
  currentMuscleKey=key;
  const m=MUSCLES.find(x=>x.key===key);
  navStack=['home'];
  document.querySelectorAll('.mz').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll(`[data-muscle="${key}"]`).forEach(el=>el.classList.add('selected'));
  document.querySelectorAll('.muscle-chip').forEach(el=>
    el.classList.toggle('active', el.textContent.trim().includes(m.label))
  );
  setHeader(m.label,'Chargement…');
  document.getElementById('backBtn').style.display='block';
  document.getElementById('nav-home').classList.add('active');
  document.getElementById('nav-seance').classList.remove('active');
  showScreen('screenExos');
  loadExos(m.cat);
}

async function loadExos(catId){
  const wrap=document.getElementById('exoListWrap');
  wrap.innerHTML=`<div class="loading"><div class="spinner"></div>Chargement…</div>`;
  try{
    let res=await fetch(`${WGER}/exerciseinfo/?format=json&language=2&category=${catId}&limit=40`);
    let data=await res.json();
    allExos=data.results||[];
    if(allExos.length<4){
      res=await fetch(`${WGER}/exerciseinfo/?format=json&category=${catId}&limit=40`);
      data=await res.json();
      allExos=data.results||[];
    }
    const m=MUSCLES.find(x=>x.key===currentMuscleKey);
    setHeader(m?m.label:'Exercices',`${allExos.length} exercice${allExos.length>1?'s':''}`);
    renderExos();
  } catch(e){
    wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Connexion impossible.<br>Vérifiez internet.</p></div>`;
  }
}

function renderExos(){
  const wrap=document.getElementById('exoListWrap');
  const list=currentLevel==='all'?allExos:allExos.filter(e=>getLevel(e.id)===currentLevel);
  if(!list.length){
    wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">🤷</div><p>Aucun exercice pour ce niveau.</p></div>`;
    return;
  }
  wrap.innerHTML=`<div class="exo-list">${list.map(e=>{
    const name=getName(e), img=getImg(e), lvl=getLevel(e.id), cat=e.category?e.category.name:'';
    return `<div class="exo-card" onclick="openExo(${e.id})">
      <div class="exo-img-wrap">
        ${img?`<img src="${img}" alt="${name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'exo-img-ph\\'>🏋️</div>'">`:`<div class="exo-img-ph">🏋️</div>`}
      </div>
      <div class="exo-body">
        <div class="exo-header">
          <div class="exo-name">${name}</div>
          <span class="exo-level lv-${lvl}">${lvl==='debutant'?'Débutant':'Confirmé'}</span>
        </div>
        <div class="exo-cat">${cat}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openExo(id){
  const e=allExos.find(x=>x.id===id); if(!e) return;
  currentExo=e;
  navStack.push('exos');
  const name=getName(e), desc=getDesc(e), img=getImg(e), lvl=getLevel(e.id);
  const inSeance=seance.some(s=>s.id===id);
  const cat=e.category?e.category.name:'';
  const equip=e.equipment?e.equipment.map(q=>q.name).join(', '):'';
  const musc=e.muscles?e.muscles.map(m=>m.name_en||m.name).join(', '):'';
  const muscSec=e.muscles_secondary?e.muscles_secondary.map(m=>m.name_en||m.name).join(', '):'';
  const imgs=e.images||[];
  setHeader(name,cat);
  document.getElementById('detailContent').innerHTML=`
    <div class="detail-img-wrap">
      ${img?`<img src="${img}" alt="${name}" onerror="this.parentElement.innerHTML='<div style=\\'font-size:64px\\'>🏋️</div>'">`:`<div style="font-size:64px">🏋️</div>`}
    </div>
    ${imgs.length>1?`<div class="thumb-row">${imgs.map(i=>`<img src="${i.image}" loading="lazy"/>`).join('')}</div>`:''}
    <div class="detail-header">
      <div class="detail-name">${name}</div>
      <div class="badges">
        <span class="badge ${lvl==='debutant'?'badge-green':'badge-amber'}">${lvl==='debutant'?'Débutant':'Confirmé'}</span>
        ${cat?`<span class="badge badge-gray">📂 ${cat}</span>`:''}
        ${equip?`<span class="badge badge-gray">🏋️ ${equip}</span>`:''}
      </div>
    </div>
    ${desc?`<div class="detail-section"><h3>Description</h3><p>${desc}</p></div>`:''}
    ${musc?`<div class="detail-section"><h3>Muscles principaux</h3><div class="muscles-row">${musc.split(', ').map(m=>`<span class="badge badge-green">${m}</span>`).join('')}</div></div>`:''}
    ${muscSec?`<div class="detail-section"><h3>Muscles secondaires</h3><div class="muscles-row">${muscSec.split(', ').map(m=>`<span class="badge badge-gray">${m}</span>`).join('')}</div></div>`:''}
    <button class="add-btn ${inSeance?'added':''}" id="addBtn" onclick="toggleSeance(${id})">
      ${inSeance?'✓ Ajouté à ma séance':'+ Ajouter à ma séance'}
    </button>
  `;
  showScreen('screenDetail');
}

function toggleSeance(id){
  const e=allExos.find(x=>x.id===id); if(!e) return;
  const idx=seance.findIndex(s=>s.id===id);
  if(idx===-1){
    seance.push({id:e.id,name:getName(e),done:false});
    showToast('Ajouté à la séance 💪');
    document.getElementById('addBtn').textContent='✓ Ajouté à ma séance';
    document.getElementById('addBtn').classList.add('added');
  } else {
    seance.splice(idx,1);
    showToast('Retiré de la séance');
    document.getElementById('addBtn').textContent='+ Ajouter à ma séance';
    document.getElementById('addBtn').classList.remove('added');
  }
  updateBadge();
}

function renderSeance(){
  const el=document.getElementById('seanceContent');
  if(!seance.length){
    el.innerHTML=`<div class="seance-empty"><div class="icon">📋</div><p>Ta séance est vide.<br>Parcours les muscles et ajoute des exercices !</p></div>`;
    return;
  }
  const done=seance.filter(s=>s.done).length;
  el.innerHTML=`
    <div class="seance-top"><div class="seance-top-title">${seance.length} exercice${seance.length>1?'s':''}</div>
    <button class="clear-btn" onclick="clearSeance()">Vider</button></div>
    ${seance.map(s=>`<div class="seance-item">
      <div class="seance-item-name">${s.name}</div>
      <div class="check ${s.done?'on':''}" onclick="toggleDone(${s.id})">
        ${s.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20,6 9,17 4,12"/></svg>':''}
      </div>
    </div>`).join('')}
    <div class="seance-footer">
      <span>${done} / ${seance.length} réalisés</span>
      <button class="finish-btn" onclick="finishSeance()">Terminer 🎉</button>
    </div>`;
}

function toggleDone(id){ const s=seance.find(x=>x.id===id); if(s){s.done=!s.done;} renderSeance(); }
function clearSeance(){ if(confirm('Vider la séance ?')){seance=[];updateBadge();renderSeance();} }
function finishSeance(){
  const done=seance.filter(s=>s.done).length;
  if(!done){showToast('Coche au moins un exercice !');return;}
  showToast(`Bravo ! ${done} exercice${done>1?'s':''} réalisé${done>1?'s':''} 🎉`);
  seance=[];updateBadge();renderSeance();
}
function updateBadge(){
  const b=document.getElementById('seanceBadge');
  if(seance.length>0){b.style.display='inline';b.textContent=seance.length;}
  else{b.style.display='none';}
}

function goBack(){
  const prev=navStack.pop();
  if(!prev||prev==='home'){
    setHeader('Coach <span style="color:var(--green)">Muscu</span>','Sélectionne un muscle');
    document.getElementById('backBtn').style.display='none';
    showScreen('screenHome');
  } else if(prev==='exos'){
    const m=MUSCLES.find(x=>x.key===currentMuscleKey);
    setHeader(m?m.label:'Exercices',`${allExos.length} exercices`);
    showScreen('screenExos');
  }
}

function showNav(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+tab).classList.add('active');
  if(tab==='home'){
    setHeader('Coach <span style="color:var(--green)">Muscu</span>','Sélectionne un muscle');
    document.getElementById('backBtn').style.display='none';
    navStack=[];
    showScreen('screenHome');
  } else if(tab==='seance'){
    document.getElementById('backBtn').style.display='none';
    setHeader('Ma <span style="color:var(--green)">séance</span>','Exercices sélectionnés');
    renderSeance();
    showScreen('screenSeance');
  }
}

function setLevel(lvl,btn){
  currentLevel=lvl;
  document.querySelectorAll('.level-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderExos();
}
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function setHeader(title,sub){ document.getElementById('headerTitle').innerHTML=title; document.getElementById('headerSub').textContent=sub; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

init();
</script>
</body>
</html>
